name: XiaoKeShift
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XiaoKeShift:
    type: application
    platform: iOS
    sources:
      - path: XiaoKeShift
    dependencies:
      - target: XiaoKeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeshift
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone＋iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP   # Yu-Juh Wu（付費開發者帳號）；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: XiaoKeShift/XiaoKeShift.entitlements
    info:
      path: XiaoKeShift/Info.plist
      properties:
        CFBundleDisplayName: 小柯班表
        CFBundleDevelopmentRegion: zh_TW
        UILaunchScreen: {}
        UIFileSharingEnabled: true          # 「檔案」App 看得到 data.json
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsFullAccessUsageDescription: 把班表寫到行事曆（可同步到 Google 行事曆），並在月曆上顯示你的行程。
        NSCalendarsUsageDescription: 把班表寫到行事曆（可同步到 Google 行事曆），並在月曆上顯示你的行程。
        NSAlarmKitUsageDescription: 依照班別設定的時間叫你起床上班。
        NSPhotoLibraryUsageDescription: 在備註記錄插入照片。
        NSLocalNetworkUsageDescription: 讓同一個 Wi-Fi 的小柯機器人查詢班表（App 開著時）。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:     # iPad 四個方向都可以（也支援分割畫面）
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  XiaoKeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - XiaoKeShift/Day.swift
      - XiaoKeShift/Almanac.swift
      - XiaoKeShift/Holidays.swift
      - XiaoKeShift/Models.swift
      - XiaoKeShift/Store.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeshift.widget
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone＋iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 小柯班表
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
